<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1020">
<title>Quản trị lời chúc · Nhật Nguyệt Đồng Huy</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  :root {
    --bg: #0a1020; --card: rgba(255, 255, 255, .045); --line: rgba(255, 214, 150, .16);
    --text: #f6ecd9; --muted: #b9ab93; --gold: #ffc56e; --red: #ff8a7a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100svh; background: radial-gradient(90% 60% at 50% 0%, #17203f 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text); font-family: "Be Vietnam Pro", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  :where(button, a, input):focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .wrap { width: min(760px, 100%); margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 60px max(16px, env(safe-area-inset-left)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 26px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; font-family: "Playfair Display", serif; font-weight: 600; font-size: 19px; white-space: nowrap; }
  .brand img { width: 30px; height: 30px; }
  .back { flex: none; font-size: 13.5px; color: var(--muted); text-decoration: none; border-bottom: 1px dashed currentColor; white-space: nowrap; }
  .back:hover { color: var(--gold); }
  h1 { margin: 0 0 6px; font-family: "Playfair Display", serif; font-weight: 600; font-size: clamp(28px, 6vw, 38px); line-height: 1.2; }
  h1 em { color: var(--gold); }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 14.5px; line-height: 1.55; }
  .card { padding: 22px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
  .field {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: rgba(255, 255, 255, .05); font-size: 15px;
  }
  .field:focus { outline: none; border-color: rgba(255, 197, 110, .6); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(255, 200, 120, .1); cursor: pointer; font-size: 14px; font-weight: 600;
    color: var(--text); text-decoration: none; white-space: nowrap; transition: background .2s;
  }
  .btn:hover { background: rgba(255, 200, 120, .2); }
  .btn.primary { border: 0; background: linear-gradient(135deg, #ffd48a, #ff9a45); color: #2a1605; }
  .btn:disabled { opacity: .6; cursor: progress; }
  .login form { display: grid; gap: 12px; margin-top: 14px; }
  .remember { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
  .remember input { width: 16px; height: 16px; accent-color: var(--gold); }
  .note { margin: 12px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
  .note.ok { color: #9be6bd; }
  .note.err { color: var(--red); }
  .who { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; font-size: 13.5px; color: var(--muted); }
  .who b { color: var(--text); font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat { padding: 14px 14px 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .stat b { display: block; font-family: "Playfair Display", serif; font-size: 28px; line-height: 1.1; color: var(--gold); }
  .stat span { font-size: 12.5px; color: var(--muted); }
  .tools { display: flex; gap: 10px; margin-bottom: 14px; }
  .tools .field { flex: 1; padding: 10px 14px; border-radius: 999px; }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .item {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
    padding: 13px 12px 12px 16px; border-radius: 14px; background: var(--card); border: 1px solid transparent;
  }
  .item.fresh { animation: fresh 1.2s ease-out; }
  @keyframes fresh { from { background: rgba(255, 200, 120, .22); border-color: rgba(255, 197, 110, .6); } }
  .item .txt { font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
  .item .meta { grid-column: 1; font-size: 12.5px; color: var(--muted); }
  .item .meta b { color: var(--gold); font-weight: 600; }
  .del {
    grid-column: 2; grid-row: 1 / span 2; min-width: 74px; padding: 9px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255, 138, 122, .45); background: rgba(255, 110, 90, .08); color: var(--red); font-size: 13px; font-weight: 600;
  }
  .del:hover { background: rgba(255, 110, 90, .18); }
  .del.armed { background: #e8553f; border-color: #e8553f; color: #fff; }
  .empty { padding: 26px 0; text-align: center; color: var(--muted); }
  .more { display: block; margin: 16px auto 0; }
  .toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 11px 18px; border-radius: 999px; background: rgba(14, 20, 40, .95); border: 1px solid var(--line);
    font-size: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
  }
  @media (max-width: 520px) {
    .brand { font-size: 16px; }
    .brand img { width: 24px; height: 24px; }
    .stat b { font-size: 23px; }
    .item { grid-template-columns: 1fr; }
    .item .meta { grid-row: 2; }
    .del { grid-column: 1; grid-row: 3; justify-self: start; margin-top: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .item.fresh { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img src="assets/favicon.svg" alt="">Nhật Nguyệt Đồng Huy</div>
    <a class="back" href="./">← Trang lồng đèn</a>
  </header>

  <h1>Quản trị <em>lời chúc</em></h1>
  <p class="sub">Gỡ lời chúc không phù hợp, lời chúc sẽ biến mất ngay trên mọi màn hình đang mở, kể cả màn hình lớn.</p>

  <section class="card login" id="login" hidden>
    <b>Mật khẩu quản trị</b>
    <form id="loginForm">
      <input type="text" name="username" value="admin" autocomplete="username" hidden>
      <input class="field" id="password" type="password" required autocomplete="current-password" placeholder="Mật khẩu" aria-label="Mật khẩu quản trị">
      <label class="remember"><input type="checkbox" id="remember" checked> Ghi nhớ trên máy này</label>
      <button class="btn primary" id="signIn" type="submit">Vào trang quản trị</button>
    </form>
    <p class="note" id="loginNote" role="status"></p>
  </section>

  <section id="panel" hidden>
    <div class="who">
      <span>Đang ở chế độ quản trị</span>
      <span style="display:flex;gap:8px">
        <a class="btn" href="./?tv" target="_blank" rel="noopener">Mở màn hình lớn</a>
        <button class="btn" id="signOut">Thoát</button>
      </span>
    </div>
    <div class="stats">
      <div class="stat"><b id="sVisits">–</b><span>người ghé thăm</span></div>
      <div class="stat"><b id="sWishes">–</b><span>lời chúc</span></div>
      <div class="stat"><b id="sHearts">–</b><span>lượt thả tim</span></div>
    </div>
    <div class="tools">
      <input class="field" id="search" type="search" placeholder="Tìm trong lời chúc đã tải…" aria-label="Tìm lời chúc">
    </div>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden>Chưa có lời chúc nào.</p>
    <button class="btn more" id="more" hidden>Xem thêm lời chúc cũ hơn</button>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// Same project and publishable key as the public page. There are no accounts: the admin password is
// checked on the server (bcrypt hash in a table the page can't read) by `admin_check` and
// `admin_delete_wish`, so nothing in this file lets anyone delete a wish.
const db = createClient('https://frznqknnrslqmwpnpojl.supabase.co', 'sb_publishable_1Rnc5hqFEPeEq0hR7xjgvQ_hoiTkk4u',
  { auth: { persistSession: false } });
const PASS_KEY = 'ttt-admin-pass';
const PAGE = 50;
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n).toLocaleString('vi-VN');
let rows = [], hasMore = false, channel = null, toastTimer, pass = '';

function toast(msg) {
  $('toast').textContent = msg; $('toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').hidden = true; }, 3200);
}
function when(iso) {
  const t = new Date(iso), s = (Date.now() - t) / 1000, p = (n) => String(n).padStart(2, '0');
  if (s < 60) return 'vừa xong';
  if (s < 3600) return `${Math.floor(s / 60)} phút trước`;
  if (s < 86400) return `${Math.floor(s / 3600)} giờ trước`;
  return `${p(t.getDate())}/${p(t.getMonth() + 1)} ${p(t.getHours())}:${p(t.getMinutes())}`;
}
function show(which) { for (const id of ['login', 'panel']) $(id).hidden = id !== which; }
const store = {
  get() { try { return sessionStorage.getItem(PASS_KEY) || localStorage.getItem(PASS_KEY) || ''; } catch { return ''; } },
  set(v, remember) { try { (remember ? localStorage : sessionStorage).setItem(PASS_KEY, v); } catch {} },
  clear() { try { sessionStorage.removeItem(PASS_KEY); localStorage.removeItem(PASS_KEY); } catch {} },
};
function loginError(msg) { $('loginNote').className = 'note err'; $('loginNote').textContent = msg; }

/* ---- Password check (on the server) ---- */
async function checkPass(p) {
  const { data, error } = await db.rpc('admin_check', { p_pass: p });
  if (error) return { ok: false, msg: error.code === 'P0001' ? error.message : 'Trang quản trị chưa được cài trên Supabase, hoặc mạng đang lỗi.' };
  return { ok: data === true, msg: 'Sai mật khẩu.' };
}
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('signIn').disabled = true;
  $('loginNote').textContent = '';
  const p = $('password').value;
  const { ok, msg } = await checkPass(p);
  $('signIn').disabled = false;
  $('password').value = '';
  if (!ok) { loginError(msg); return; }
  store.set(p, $('remember').checked);
  openPanel(p);
});
$('signOut').addEventListener('click', () => {
  store.clear(); pass = '';
  channel?.unsubscribe(); channel = null;
  show('login');
});

async function openPanel(p) {
  pass = p;
  show('panel');
  loadStats();
  rows = []; await loadMore();
  channel = db.channel('admin-wishes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'wishes' }, ({ new: w }) => {
      if (rows.some(r => r.id === w.id)) return;
      rows.unshift(w); draw(w.id); loadStats();
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'wishes' }, ({ old }) => {
      rows = rows.filter(r => r.id !== old.id); draw(); loadStats();
    })
    .subscribe();
}
// Coming back with a remembered password: check it again, then go straight to the list.
(async () => {
  const saved = store.get();
  if (!saved) { show('login'); return; }
  const { ok } = await checkPass(saved);
  if (ok) openPanel(saved); else { store.clear(); show('login'); }
})();

/* ---- Data ---- */
async function loadStats() {
  const [w, h, v] = await Promise.all([
    db.from('wishes').select('id', { count: 'exact', head: true }),
    db.from('hearts').select('id', { count: 'exact', head: true }),
    db.rpc('visit_count'),
  ]);
  $('sWishes').textContent = w.count != null ? fmt(w.count) : '–';
  $('sHearts').textContent = h.count != null ? fmt(h.count) : '–';
  $('sVisits').textContent = v.data != null ? fmt(v.data) : '–';
}
async function loadMore() {
  let q = db.from('wishes').select('id,text,name,created_at').order('id', { ascending: false }).limit(PAGE);
  if (rows.length) q = q.lt('id', rows[rows.length - 1].id);
  $('more').disabled = true;
  const { data, error } = await q;
  $('more').disabled = false;
  if (error) { toast('Không tải được lời chúc, thử lại nhé.'); return; }
  rows.push(...data);
  hasMore = data.length === PAGE;
  draw();
}
$('more').addEventListener('click', loadMore);
$('search').addEventListener('input', () => draw());
setInterval(() => { if (!$('panel').hidden) draw(); }, 60000); // keep "x phút trước" fresh

function draw(freshId) {
  const q = $('search').value.trim().toLowerCase();
  const shown = q ? rows.filter(r => (r.text + ' ' + (r.name || '')).toLowerCase().includes(q)) : rows;
  $('list').replaceChildren(...shown.map(r => {
    const li = document.createElement('li');
    li.className = 'item' + (r.id === freshId ? ' fresh' : '');
    const txt = document.createElement('span'); txt.className = 'txt'; txt.textContent = r.text;
    const meta = document.createElement('span'); meta.className = 'meta';
    if (r.name) { const b = document.createElement('b'); b.textContent = r.name; meta.append(b, ' · '); }
    meta.append(when(r.created_at), ` · #${r.id}`);
    const del = document.createElement('button');
    del.className = 'del'; del.type = 'button'; del.textContent = 'Gỡ';
    del.setAttribute('aria-label', `Gỡ lời chúc: ${r.text}`);
    del.addEventListener('click', () => remove(r, del));
    li.append(txt, del, meta);
    return li;
  }));
  $('empty').hidden = shown.length > 0;
  $('empty').textContent = q ? 'Không có lời chúc nào khớp.' : 'Chưa có lời chúc nào.';
  $('more').hidden = !hasMore || !!q;
}

// Two taps to remove, so a slip of the thumb doesn't delete anything.
async function remove(r, btn) {
  if (!btn.classList.contains('armed')) {
    btn.classList.add('armed'); btn.textContent = 'Chắc chắn?';
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = 'Gỡ'; } }, 3000);
    return;
  }
  btn.disabled = true; btn.textContent = 'Đang gỡ…';
  const { data, error } = await db.rpc('admin_delete_wish', { p_pass: pass, p_id: r.id });
  if (error || data !== true) {
    btn.disabled = false; btn.classList.remove('armed'); btn.textContent = 'Gỡ';
    toast(error?.code === 'P0001' ? error.message : error ? 'Chưa gỡ được, thử lại nhé.' : 'Chưa gỡ được: mật khẩu không còn đúng.');
    return;
  }
  rows = rows.filter(x => x.id !== r.id);
  draw(); loadStats();
  toast('Đã gỡ lời chúc.');
}
</script>
</body>
</html>
